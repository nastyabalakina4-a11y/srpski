<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Базовый словарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4C1B32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F5EFE3;--surface:#FCFAF4;--ink:#2B2230;--soft:#5F5260;--plum:#6E2A48;--deep:#4C1B32;--berry:#B23A5B;--gold:#B67C22;--teal:#2F6E72;--line:#E5D9C6}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(120% 70% at 100% 0%,#EFE4D0 0%,transparent 55%),var(--paper);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:40px}
  .hero{padding:30px 22px 24px;text-align:center;color:#F7ECEF;background:linear-gradient(160deg,var(--plum),var(--deep));position:relative}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--gold) 0 33.3%,#F7ECEF 33.3% 66.6%,var(--berry) 66.6% 100%)}
  .hero h1{font-family:'Spectral',serif;font-weight:600;font-size:28px;margin:0 0 4px}
  .hero p{margin:0;color:#EBD6DD;font-size:14.5px}
  .wrap{max-width:620px;margin:0 auto;padding:16px 16px}
  input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
  input:focus,select:focus{outline:none;border-color:var(--plum)}
  button{font:inherit;font-weight:600;cursor:pointer;border:none;border-radius:11px;padding:10px 16px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 10px}
  .chip{background:#fff;border:1.5px solid var(--line);color:var(--soft);padding:6px 14px;font-size:14px;border-radius:20px}
  .chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
  .stats{display:flex;justify-content:space-between;align-items:center;color:var(--soft);font-size:14px;margin:2px 2px 8px;gap:8px;flex-wrap:wrap}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 12px}
  .bar>i{display:block;height:100%;background:var(--teal);width:0}
  .w{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  .w .t{flex:1;min-width:0}
  .w .sr{font-weight:700;color:var(--deep);font-size:17px;word-break:break-word}
  .w .sr small{font-weight:600;color:var(--gold);font-size:12px;margin-left:6px}
  .w .ru{color:var(--ink);font-size:15px}
  .w.done{opacity:.55}.w.done .sr{text-decoration:line-through;text-decoration-color:var(--berry)}
  .ib{background:#fff;border:1.5px solid var(--line);width:38px;height:38px;padding:0;font-size:16px;border-radius:10px;flex-shrink:0}
  .ib.ok{background:var(--teal);border-color:var(--teal);color:#fff}
  .ib.sp.on{border-color:var(--gold);background:#FFF4DC}
  .acts{display:flex;gap:6px;flex-shrink:0}
  .more{background:transparent;border:1.5px solid var(--plum);color:var(--plum);width:100%;margin:6px 0}
  .empty{text-align:center;color:var(--soft);padding:26px 10px;font-style:italic}
  .tg{font-size:13px;color:var(--soft)}
  .fc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px 18px;text-align:center;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;user-select:none}
  .fc .big{font-family:'Spectral',serif;font-weight:700;font-size:32px;color:var(--deep);word-break:break-word}
  .fc .ans{font-size:20px;color:var(--ink);min-height:30px}
  .fc .hint{font-size:13px;color:var(--soft)}
  .fcb{display:flex;gap:10px;margin-top:12px}
  .fcb button{flex:1;padding:13px}
  .yes{background:var(--teal);color:#fff}.no{background:#fff;border:1.5px solid var(--berry);color:var(--berry)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%}
  #toast.show{opacity:1}
  .speaking{outline:2px solid var(--gold);outline-offset:2px}
</style></head><body>
<div class="hero"><h1>📚 Базовый словарь</h1><p>Слова, которые нужны, чтобы просто разговаривать</p></div>
<div class="wrap">
  <input id="q" placeholder="🔍 Поиск: по-сербски или по-русски" autocomplete="off" spellcheck="false">
  <select id="topic"></select>
  <div class="row" id="filters">
    <button class="chip on" data-f="all">Все</button>
    <button class="chip" data-f="learn">Учу</button>
    <button class="chip" data-f="done">Выучено</button>
    <span style="flex:1"></span>
    <button class="chip" id="bScript">Лат</button>
    <button class="chip" id="bMode">🃏 Карточки</button>
  </div>
  <div class="stats"><span id="cnt"></span><span id="prog"></span></div>
  <div class="bar"><i id="barfill"></i></div>
  <div id="list"></div>
  <div id="cards" style="display:none"></div>
  <p class="tg" style="margin-top:18px">Озвучка: нажми 🔊. Если на телефоне есть сербский голос, играет он; иначе онлайн-озвучка или готовые файлы из приложения.</p>
</div>
<div id="toast"></div>

    if(S.mode==='cards'){renderCard(list);return;}
    var L=$('list');
    if(!list.length){L.innerHTML='<div class="empty">Ничего не найдено</div>';return;}
    var h='';var n=Math.min(shown,list.length);
    for(var j=0;j<n;j++){var i=list[j],it=I[i],d=!!S.learned[it.s];
      h+='<div class="w'+(d?' done':'')+'" data-i="'+i+'"><div class="t"><div class="sr">'+esc(show(it.s))+(it.g?'<small>'+it.g+'</small>':'')+'</div><div class="ru">'+esc(it.r)+'</div></div><div class="acts"><button class="ib sp" data-a="sp" aria-label="Озвучить">🔊</button><button class="ib'+(d?' ok':'')+'" data-a="dn" aria-label="Выучено">✓</button></div></div>';}
    if(n<list.length)h+='<button class="more" id="more">Показать ещё ('+(list.length-n)+')</button>';
    L.innerHTML=h;
  }
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  $('list').addEventListener('click',function(e){
    if(e.target.id==='more'){shown+=LIM;render();return;}
    var b=e.target.closest('button[data-a]');if(!b)return;
    var w=b.closest('.w');var it=I[+w.dataset.i];
    if(b.dataset.a==='sp'){speak(it.s,b);return;}
    S.learned[it.s]=!S.learned[it.s];if(!S.learned[it.s])delete S.learned[it.s];save();
    if(S.f!=='all'){render();}else{w.classList.toggle('done',!!S.learned[it.s]);b.classList.toggle('ok',!!S.learned[it.s]);updStats(pool());}
  });
  // ---- cards ----
  var cardI=-1,flipped=false;
  function renderCard(list){
    var C=$('cards');
    var todo=list.filter(function(i){return !S.learned[I[i].s];});
    if(!todo.length){C.innerHTML='<div class="empty">В этой выборке нет слов «Учу». Смени тему или фильтр.</div>';return;}
    if(todo.indexOf(cardI)<0)cardI=todo[Math.floor(Math.random()*todo.length)];
    var it=I[cardI];
    var front=S.rev?it.r:show(it.s),back=S.rev?show(it.s):it.r;
    C.innerHTML='<div class="stats"><span>Осталось: '+todo.length+'</span><button class="chip" id="bRev">'+(S.rev?'RU → SR':'SR → RU')+'</button></div><div class="fc" id="fc"><div class="big">'+esc(front)+'</div><div class="ans" id="ans">'+(flipped?esc(back):'')+'</div><div class="hint">'+(flipped?'':'Нажми, чтобы увидеть ответ')+'</div></div><div class="fcb"><button class="ib" style="width:auto;padding:0 14px" id="bSp">🔊</button><button class="no" id="bNo">Ещё учу</button><button class="yes" id="bYes">Знаю ✓</button></div>';
    $('fc').onclick=function(){flipped=true;if(!S.rev)speak(it.s,null);renderCard(list);};
    $('bSp').onclick=function(e){speak(it.s,e.currentTarget);};
    $('bRev').onclick=function(){S.rev=!S.rev;save();flipped=false;renderCard(list);};
    $('bNo').onclick=function(){flipped=false;var rest=todo.filter(function(x){return x!==cardI;});cardI=rest.length?rest[Math.floor(Math.random()*rest.length)]:cardI;renderCard(list);};
    $('bYes').onclick=function(){S.learned[it.s]=true;save();flipped=false;cardI=-1;render();};
  }
  // ---- controls ----
  var sel=$('topic');var oh='<option value="-1">Все темы ('+I.length+')</option>';
  var cnt={};I.forEach(function(x){cnt[x.t]=(cnt[x.t]||0)+1;});
  T.forEach(function(t,i){oh+='<option value="'+i+'">'+esc(t)+' ('+(cnt[i]||0)+')</option>';});
  sel.innerHTML=oh;sel.value=S.topic;
  sel.onchange=function(){S.topic=sel.value;save();shown=LIM;cardI=-1;flipped=false;render();};
  var qt;$('q').oninput=function(){clearTimeout(qt);qt=setTimeout(function(){shown=LIM;cardI=-1;flipped=false;render();},120);};
  [].forEach.call(document.querySelectorAll('#filters .chip[data-f]'),function(b){
    b.classList.toggle('on',b.dataset.f===S.f);
    b.onclick=function(){S.f=b.dataset.f;save();[].forEach.call(document.querySelectorAll('#filters .chip[data-f]'),function(x){x.classList.toggle('on',x===b);});shown=LIM;cardI=-1;flipped=false;render();};
  });
  $('bScript').onclick=function(){S.cyr=!S.cyr;save();render();};
  $('bMode').onclick=function(){S.mode=S.mode==='cards'?'list':'cards';save();cardI=-1;flipped=false;render();};
  render();
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
</body></html>
